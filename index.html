<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Połącz Kropki • Connect the Dots • Une los Puntos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fce7f3 100%);
    }

    .ui-bar {
      position: relative;
      z-index: 100;
      pointer-events: auto;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #gameCanvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: pointer;
    }

    #gameCanvas.modal-open {
      pointer-events: none;
    }

    .btn-interactive {
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: transform 0.12s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-interactive:active {
      transform: scale(0.93);
    }

    #win-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px;
      pointer-events: auto;
    }

    #win-modal-overlay.active {
      display: flex;
    }

    #win-modal-card {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      padding: 22px 18px;
      text-align: center;
      border: 4px solid #fbbf24;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
    }

    #speech-toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px) scale(0.9);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 92vw;
      text-align: center;
    }

    #speech-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #celebration-countdown-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 94vw;
    }

    #celebration-countdown-bar.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    body.compact-fullscreen #sub-header-bar {
      display: none !important;
    }
    body.compact-fullscreen header {
      padding-top: 3px !important;
      padding-bottom: 3px !important;
    }

    #standalone-banner {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 950;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.96);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 18px;
      border: 2px solid #fbbf24;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      max-width: 94vw;
      pointer-events: auto;
    }
    #standalone-banner.show {
      display: flex;
    }

    @keyframes wordPop {
      0% { transform: scale(0.75); opacity: 0.3; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .word-chip-pop {
      animation: wordPop 0.24s ease-out forwards;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none" style="height: 100dvh;">

  <!-- GÓRNY PASEK NAWIGACJI -->

            <span>🇵🇱</span><span>PL</span>

          <button type="button" data-lang="en" class="lang-btn btn-interactive px-2 sm:px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 text-slate-700 hover:bg-white/70">
            <span>🇬🇧</span><span>EN</span>

            <span>🇪🇸</span><span>ES</span>

        </div>
      </div>

        </button>
        <button type="button" data-level="1" class="level-btn btn-interactive px-1.5 sm:px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 text-slate-700 hover:bg-amber-100 shrink-0">
          <span>❤️</span><span class="lvl-label hidden xl:inline" data-lvl-idx="1">Serce</span><span class="xl:hidden">2</span>
        </button>
        <button type="button" data-level="2" class="level-btn btn-interactive px-1.5 sm:px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 text-slate-700 hover:bg-amber-100 shrink-0">
          <span>🐱</span><span class="lvl-label hidden xl:inline" data-lvl-idx="2">Kotek</span><span class="xl:hidden">3</span>

        <button type="button" data-level="3" class="level-btn btn-interactive px-1.5 sm:px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 text-slate-700 hover:bg-amber-100 shrink-0">

          <span>🦄</span><span class="lvl-label hidden md:inline" data-lvl-idx="5">Nina</span><span class="md:hidden">6</span>

        <button type="button" data-level="6" class="level-btn btn-interactive px-1.5 sm:px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 text-slate-700 hover:bg-amber-100 shrink-0" title="Nikola i angielski">
          <span>🦋</span><span class="lvl-label hidden md:inline" data-lvl-idx="6">Nikola</span><span class="md:hidden">7</span>

      </div>

      <!-- Przyciski narzędziowe -->
      <div class="flex items-center gap-1">
        <button type="button" id="btn-sound" class="btn-interactive bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border border-emerald-300 px-2 sm:px-2.5 py-1 rounded-2xl text-xs sm:text-sm font-bold flex items-center gap-1 shadow-sm" title="Dźwięk">
          <span id="sound-icon" class="text-sm sm:text-base">🔊</span>
          <span id="ui-sound" class="hidden lg:inline">Dźwięk</span>

        <button type="button" id="btn-reset" class="btn-interactive bg-rose-100 hover:bg-rose-200 text-rose-900 border border-rose-300 px-2 sm:px-2.5 py-1 rounded-2xl text-xs sm:text-sm font-bold flex items-center gap-1 shadow-sm" title="Od nowa">
          <span class="text-sm sm:text-base">🔄</span>
          <span id="ui-reset" class="hidden sm:inline">Od nowa</span>
        </button>
        <!--
        <button type="button" id="btn-download-index" class="btn-interactive bg-amber-300 hover:bg-amber-400 text-slate-950 border border-amber-500 px-2 sm:px-2.5 py-1 rounded-2xl text-xs sm:text-sm font-extrabold flex items-center gap-1 shadow-sm" title="Pobierz gotowy plik index.html na GitHub Pages">

        <button type="button" id="btn-fullscreen" class="btn-interactive bg-indigo-100 hover:bg-indigo-200 text-indigo-900 border border-indigo-300 px-2 sm:px-2.5 py-1 rounded-2xl text-xs sm:text-sm font-bold flex items-center gap-1 shadow-sm" title="Pełny ekran" aria-label="Pełny ekran">

  </header>

  <!-- PASEK PODPOWIEDZI I AKTUALNEJ KROPKI -->
  <div id="sub-header-bar" class="ui-bar w-full px-1.5 sm:px-3 pt-1 pb-0.5 shrink-0">
    <div class="max-w-4xl mx-auto flex items-center justify-between bg-white/90 backdrop-blur-sm px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-2xl shadow-sm border border-indigo-100 gap-1.5">
      
      <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
        <span id="current-level-emoji" class="text-lg sm:text-2xl shrink-0">⭐</span>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span id="current-level-title" class="font-bold text-indigo-950 text-xs sm:text-base truncate">Poziom 1: Gwiazdka</span>
            <span id="progress-badge" class="bg-indigo-100 text-indigo-800 text-[11px] sm:text-xs font-bold px-2 py-0.5 rounded-full shrink-0">0 / 10</span>
          </div>
          <p id="instruction-text" class="text-[10px] sm:text-xs text-slate-600 truncate">Dotknij kropki 1 i połącz kolejne punkty!</p>
        </div>
      </div>

      <button type="button" id="target-speaker-btn" class="btn-interactive flex items-center gap-1.5 bg-gradient-to-r from-amber-400 to-orange-400 text-slate-950 px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-2xl shadow-sm border border-amber-300 shrink-0">
        <span class="text-sm sm:text-base">🔈</span>
        <div class="text-left leading-tight">
          <div id="ui-next-label" class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold text-amber-950/80">Teraz:</div>
          <div id="target-number-display" class="text-xs sm:text-sm font-extrabold">1 • jeden</div>
        </div>
      </button>

    </div>
  </div>

  <!-- DYNAMICZNY PASEK BUDOWANEGO ZDANIA -->

      </div>

        <span>🔊</span>
        <span id="ui-listen-btn" class="hidden sm:inline">Odsłuchaj</span>
      </span>
    </button>
  </div>

  <!-- OBSZAR GRY CANVAS -->
  <main class="relative flex-1 w-full h-full overflow-hidden flex items-center justify-center">
    <div id="speech-toast" class="bg-indigo-950/90 text-white px-4 py-1.5 rounded-full shadow-lg border-2 border-amber-300 font-extrabold text-sm sm:text-base flex items-center gap-2">
      <span>🔊</span>
      <span id="speech-toast-text">1 - jeden</span>
    </div>

    <div id="celebration-countdown-bar" class="bg-indigo-950/95 text-white px-3.5 sm:px-5 py-2 rounded-2xl shadow-xl border-2 border-amber-400 flex items-center gap-3">

      <span id="celebration-countdown-text" class="text-xs sm:text-sm font-extrabold tracking-wide">

      </span>
      <button type="button" id="btn-skip-celebration" class="btn-interactive bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs px-2.5 py-1 rounded-xl shadow-sm shrink-0">
        Dalej ⏭
      </button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </main>

  <!-- BANER WYJŚCIA Z RAMKI -->
  <div id="standalone-banner" role="status">
    <span id="standalone-msg" class="text-[11px] sm:text-xs font-semibold leading-tight">
      Ramka blokuje pełny ekran. Powiększono planszę!
    </span>
    <button type="button" id="btn-open-standalone" class="btn-interactive bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-[11px] sm:text-xs px-2.5 py-1.5 rounded-xl shrink-0 shadow-sm">
      🚀 Pełny ekran (Pobierz HTML)
    </button>
    <button type="button" id="btn-close-banner" class="btn-interactive text-slate-300 hover:text-white font-bold px-1.5 py-0.5 text-sm leading-none" aria-label="Zamknij">
      ✕
    </button>
  </div>

  <!-- MODAL WYGRANEJ -->
  <div id="win-modal-overlay" role="dialog" aria-modal="true">
    <div id="win-modal-card">
      <div class="text-4xl mb-1.5" id="win-emoji-badge">🎉 ⭐ 🎉</div>
      <h2 id="win-title" class="text-2xl font-extrabold text-indigo-950 mb-1">Brawo! Wspaniale!</h2>
      <p id="win-subtitle" class="text-base font-bold text-emerald-700 mb-3">To jest: Gwiazdka!</p>

      <div id="win-sentence-box" class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-3 mb-4 text-left hidden">
        <div id="win-sentence-label" class="text-[10px] font-bold uppercase tracking-wider text-amber-800 mb-1">Ułożone zdanie:</div>
        <p id="win-sentence-text" class="text-sm sm:text-base font-extrabold text-indigo-950 leading-snug mb-2.5"></p>
        <button type="button" id="btn-speak-full-modal" class="btn-interactive w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold py-2 px-3 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-sm">
          <span>🔊</span>
          <span id="ui-speak-sentence-btn">Przeczytaj całe zdanie</span>
        </button>
      </div>
      
      <div class="flex flex-col gap-2">
        <button type="button" id="btn-next-level" class="btn-interactive w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold py-3 px-5 rounded-2xl shadow-lg text-base flex items-center justify-center gap-2 border-2 border-emerald-400">
          <span id="ui-next-level-btn">Następny poziom</span>
          <span class="text-lg">➡️</span>
        </button>
        <button type="button" id="btn-replay-modal" class="btn-interactive w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2.5 px-4 rounded-2xl border border-slate-300 text-sm flex items-center justify-center gap-1.5">
          <span>🔄</span>
          <span id="ui-play-again">Zagraj jeszcze raz</span>
        </button>
      </div>
    </div>
  </div>
